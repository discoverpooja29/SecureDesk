services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: securedesk
      POSTGRES_PASSWORD: password
      POSTGRES_DB: securedesk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securedesk -d securedesk"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
